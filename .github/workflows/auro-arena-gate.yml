name: AURO Arena Evidence Gate

on:
  pull_request:
    paths:
      - 'auro_native_llm/harness/viral.py'
      - 'tests/test_auro_arena_viral.py'
      - 'scripts/auro_arena_demo.py'
      - 'docs/AURO_ARENA_LAUNCH.md'
      - '.github/workflows/auro-arena-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arena-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile Arena harness
        run: python -m py_compile auro_native_llm/harness/viral.py scripts/auro_arena_demo.py
      - name: Test Arena contracts
        run: python -m pytest -q tests/test_auro_arena_viral.py
      - name: Generate public Browser Rescue receipt
        run: python scripts/auro_arena_demo.py --out artifacts/auro-arena-browser-rescue.json
      - name: Verify receipt is content addressed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from auro_native_llm.harness.viral import canonical_sha256
          path = Path('artifacts/auro-arena-browser-rescue.json')
          receipt = json.loads(path.read_text())
          expected = receipt.pop('receipt_sha256')
          actual = canonical_sha256(receipt)
          assert expected == actual, (expected, actual)
          assert receipt['score'] > 0
          print(json.dumps({'score': receipt['score'], 'receipt_sha256': expected}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: auro-arena-browser-rescue-receipt
          path: artifacts/auro-arena-browser-rescue.json
          if-no-files-found: error
