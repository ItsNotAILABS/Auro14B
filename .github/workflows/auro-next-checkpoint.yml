name: AURO Next Checkpoint

on:
  pull_request:
    paths:
      - 'auro_native_llm/brain_state/**'
      - 'auro_native_llm/eval/**'
      - 'auro_native_llm/registry/**'
      - 'browser-runtime/src/agent-loop.js'
      - 'browser-runtime/tests/**'
      - 'training/st14b_distributed_contract.json'
      - 'tests/test_next_checkpoint.py'
      - '.github/workflows/auro-next-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: pip install pytest
      - name: Compile new runtime contracts
        run: python -m compileall auro_native_llm/brain_state auro_native_llm/eval auro_native_llm/registry
      - name: Run state registry and evaluation tests
        run: pytest -q tests/test_next_checkpoint.py
      - name: Verify distributed training contract truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('training/st14b_distributed_contract.json').read_text())
          assert cfg['status'] == 'PROTOTYPE_REQUIRES_ACCELERATOR_EXECUTION'
          assert cfg['architecture']['parameter_count'] == 14339691520
          assert 'h100_runtime_receipt_valid' in cfg['promotion_gates']
          assert cfg['data_invariants']['immutable_corpus_manifest'] is True
          assert cfg['runtime']['restore_verification_required'] is True
          PY

  chrome-agent-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test governed browser loop
        run: node --test browser-runtime/tests/agent-loop.test.js
