name: HIM Full Non-Intervened Observation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/run_him_nonintervention_observation.py
      - .github/workflows/him-nonintervention-observation.yml

permissions:
  contents: read

env:
  PYTHONPATH: .
  OBSERVATION_PROTOCOL: auro.him.nonintervention-observation.v1

jobs:
  observe-without-intervention:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip numpy pytest
      - name: Compile immutable observation instrument
        run: python -m py_compile scripts/run_him_nonintervention_observation.py
      - name: Run all eight turns without intervention
        run: python scripts/run_him_nonintervention_observation.py
      - name: Verify full transcript and receipt chain
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/him-nonintervention-observation")
          summary = json.loads((root / "summary.json").read_text())
          rows = [json.loads(line) for line in (root / "conversation.jsonl").read_text().splitlines() if line.strip()]

          assert summary["schema"] == "auro.him.nonintervention-observation.v1"
          assert summary["turns"] == 8
          assert summary["conditions"] == {
              "prompts": 8,
              "specialist_germs": 20,
              "logical_context_tokens": 500000,
              "max_actions_per_turn": 5,
              "persistent_single_session": True,
              "behavioral_intervention_during_run": False,
              "automatic_retry_or_rewrite": False,
          }
          assert summary["weight_update_performed"] is False
          assert summary["promotion_eligible"] is False
          assert len(rows) == 8

          previous = "0" * 64
          for expected, row in enumerate(rows, 1):
              assert row["sequence"] == expected
              assert row["previous_hash"] == previous
              claimed = row["hash"]
              material = dict(row)
              material.pop("hash")
              actual = hashlib.sha256(
                  json.dumps(material, sort_keys=True, separators=(",", ":"), default=str).encode()
              ).hexdigest()
              assert claimed == actual
              raw_path = Path(row["raw_report_path"])
              assert raw_path.exists()
              assert hashlib.sha256(raw_path.read_bytes()).hexdigest() == row["raw_report_sha256"]
              previous = claimed

          assert summary["receipt_head"] == previous
          assert (root / "TRANSCRIPT.md").stat().st_size > 100
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload complete non-intervened record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: him-nonintervention-observation-${{ github.sha }}
          path: artifacts/him-nonintervention-observation/**
          if-no-files-found: error
          retention-days: 90
