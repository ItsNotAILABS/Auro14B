name: AURO Neuromorphic Brain Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neuromorphic-brain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Compile canonical neuromorphic brain
        run: |
          python -m py_compile \
            auro_native_llm/brain/feline_neuromorphic.py \
            auro_native_llm/brain/neuromorphic_state.py \
            auro_native_llm/brain/neuromorphic_brain.py \
            auro_native_llm/brain/__init__.py \
            auro_native_llm/production_fleet/neuromorphic_bridge.py \
            auro_native_llm/production_fleet/persona_runtime.py \
            scripts/benchmark_neuromorphic_brain.py
      - name: Run neuromorphic contracts
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_feline_neuromorphic.py \
            tests/test_neuromorphic_bridge.py
      - name: Run deterministic neuro-energy benchmark
        run: python scripts/benchmark_neuromorphic_brain.py --cycles 64 --output evidence/neuromorphic-benchmark.json
      - name: Verify production wiring
        run: |
          PYTHONPATH=. python - <<'PY'
          from auro_native_llm.brain import HIMBrain
          from auro_native_llm.production_fleet.neuromorphic_bridge import compact_neuromorphic_state
          brain = HIMBrain()
          result = brain.cycle('urgent visual browser signal verify', importance=.9)
          snapshot = brain.snapshot()
          compact = compact_neuromorphic_state(brain)
          assert snapshot['schema'] == 'him.brain.v2.neuromorphic'
          assert snapshot['neuromorphic']['region_count'] == 44
          assert snapshot['neuromorphic']['synapse_count'] > 0
          assert result.neuromorphic['energy_ceu'] > 0
          assert compact['can_authorize_execution'] is False
          assert compact['authority'] == 'telemetry_only'
          assert snapshot['neuromorphic']['energy_unit'] == 'normalized_compute_energy_unit_not_joule'
          assert snapshot['neuromorphic']['claim_boundary']['biological_cat_brain_simulation'] is False
          PY
      - name: Emit neuromorphic evidence receipt
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          paths = [
            'auro_native_llm/brain/feline_neuromorphic.py',
            'auro_native_llm/brain/neuromorphic_state.py',
            'auro_native_llm/brain/neuromorphic_brain.py',
            'auro_native_llm/brain/__init__.py',
            'auro_native_llm/production_fleet/neuromorphic_bridge.py',
            'auro_native_llm/production_fleet/persona_runtime.py',
            'scripts/benchmark_neuromorphic_brain.py',
            'tests/test_feline_neuromorphic.py',
            'tests/test_neuromorphic_bridge.py',
            'docs/FELINE_NEUROMORPHIC_ARCHITECTURE.md',
          ]
          benchmark = json.loads(pathlib.Path('evidence/neuromorphic-benchmark.json').read_text())
          body = {
            'schema': 'auro.neuromorphic-brain-evidence.v3',
            'canonical_him_wired': True,
            'explicit_synaptic_graph': True,
            'persistent_synaptic_state': True,
            'model_context_bridge_wired': True,
            'benchmark_passed': bool(benchmark['passed']),
            'benchmark_receipt_sha256': benchmark['receipt_sha256'],
            'sparse_spiking_tested': True,
            'inhibitory_balance_tested': True,
            'refractory_threshold_tested': True,
            'normalized_energy_accounting_tested': True,
            'execution_authority_escalation_allowed': False,
            'biological_equivalence_claim': False,
            'physical_energy_efficiency_verified': False,
            'files': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
          }
          body['receipt_sha256'] = hashlib.sha256(json.dumps(body, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          pathlib.Path('evidence/neuromorphic-brain.json').write_text(json.dumps(body, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neuromorphic-brain-${{ github.sha }}
          path: |
            evidence/neuromorphic-brain.json
            evidence/neuromorphic-benchmark.json
          if-no-files-found: error
