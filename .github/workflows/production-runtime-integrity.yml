name: Production Runtime Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python test runtime
        run: python -m pip install --upgrade pip pytest numpy
      - name: Compile production runtime
        run: |
          python -m py_compile \
            auro_native_llm/production_fleet/__init__.py \
            auro_native_llm/production_fleet/capabilities.py \
            auro_native_llm/production_fleet/server.py
      - name: Import production package and run integrity tests
        run: python -m pytest -q tests/test_production_runtime_integrity.py
      - name: Install Cloudflare runtime
        working-directory: cloudflare-platform
        run: npm install
      - name: Typecheck Cloudflare authentication and quota path
        working-directory: cloudflare-platform
        run: npm run typecheck
      - name: Run Cloudflare tests
        working-directory: cloudflare-platform
        run: npm test
      - name: Emit integrity receipt
        run: |
          mkdir -p evidence
          python - <<'PY'
          import hashlib, json, pathlib, time
          paths = [
              'auro_native_llm/production_fleet/__init__.py',
              'auro_native_llm/production_fleet/capabilities.py',
              'auro_native_llm/production_fleet/server.py',
              'cloudflare-platform/src/index.ts',
              'cloudflare-platform/src/public-api.ts',
          ]
          files = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          payload = {
              'schema': 'auro.production-runtime-integrity.v1',
              'generated_at_unix': int(time.time()),
              'importable': True,
              'single_pass_routing': True,
              'hosted_chat_auth_required': True,
              'identity_bound_quota': True,
              'workers_ai_claim_boundary': 'hosted compatibility lane; not an AURO-trained checkpoint',
              'wallet_mode': 'paper-only',
              'receipt_custody': 'unsigned local or Durable Object hash chains',
              'files': files,
          }
          payload['receipt_sha256'] = hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          pathlib.Path('evidence/production-runtime-integrity.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-runtime-integrity-${{ github.sha }}
          path: evidence/production-runtime-integrity.json
          if-no-files-found: error
