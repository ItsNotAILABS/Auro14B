name: AURO Release Invariants

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-invariants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install focused Python dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Compile and import canonical runtime before any feature test
        run: |
          python -m py_compile auro_native_llm/production_fleet/runtime.py
          python -m py_compile auro_native_llm/open_weights.py
          PYTHONPATH=. python - <<'PY'
          import ast
          from pathlib import Path
          import auro_native_llm.production_fleet.runtime as runtime
          source=Path('auro_native_llm/production_fleet/runtime.py').read_text()
          tree=ast.parse(source)
          defs=[n for n in ast.walk(tree) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))]
          assert sum(n.name=='_agent_prompt' for n in defs)==1
          assert source.count('brain_cycle = self.capabilities.brain.cycle')==1
          assert source.count('council = self.agents.run')==1
          assert runtime.NovaRuntime is not None
          PY
      - name: Test checkpoint rehash and immutable training provenance
        run: PYTHONPATH=. pytest -q tests/test_release_invariants.py
      - name: Test Browser-Brain privacy admission server approval and signed mesh receipts
        run: node --test browser-brain/security.test.mjs
      - name: Enforce claim boundary
        run: |
          grep -q 'pipeline-fixture-only' auro_native_llm/open_weights.py
          grep -q 'assistant_quality_proven.*False' auro_native_llm/open_weights.py
          grep -q 'server_verified' auro_native_llm/production_fleet/runtime.py
          grep -q 'unencrypted browser memory rejected' browser-brain/security.mjs
      - name: Emit release invariant receipt
        run: |
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,pathlib
          paths=['auro_native_llm/production_fleet/runtime.py','auro_native_llm/open_weights.py','browser-brain/security.mjs','.github/workflows/release-invariants.yml']
          payload={'schema':'auro.release-invariants.v1','canonical_runtime_compile_import':True,'checkpoint_rehash_required':True,'corpus_commit_runner_environment_bound':True,'browser_memory_privacy_admission':True,'server_authoritative_execution':True,'signed_peer_task_receipts':True,'offline_chrome_full_e2e_verified':False,'files':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}}
          payload['receipt_sha256']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          pathlib.Path('evidence/release-invariants.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-invariants-${{ github.sha }}
          path: evidence/release-invariants.json
          if-no-files-found: error
