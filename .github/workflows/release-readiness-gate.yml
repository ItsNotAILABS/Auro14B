name: Exact Checkpoint Release Readiness

on:
  pull_request:
    paths:
      - "auro_native_llm/open_weights.py"
      - "scripts/readiness_score.py"
      - "scripts/checkpoint_promotion_gate.py"
      - "scripts/tokenizer_audit.py"
      - "tests/test_open_weights.py"
      - "tests/test_release_readiness.py"
      - "evidence/readiness-input.json"
      - ".github/workflows/release-readiness-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Compile release authority and checkpoint code
        run: python -m py_compile auro_native_llm/open_weights.py scripts/readiness_score.py scripts/checkpoint_promotion_gate.py scripts/tokenizer_audit.py
      - name: Run release and tokenizer compatibility regressions
        run: pytest -q tests/test_release_readiness.py tests/test_open_weights.py
      - name: Assert tokenizer v2 immutable ID layout
        run: |
          python - <<'PY'
          from auro_native_llm.open_weights import ByteTokenizer
          from scripts.tokenizer_audit import audit_manifest
          release = ByteTokenizer("v2")
          assert release.encode("stable bytes") == ByteTokenizer("v1").encode("stable bytes")
          result = audit_manifest(release.manifest())
          assert result["ready"] is True
          assert result["control_token_ids"]["<mathesis>"] == 272
          assert result["control_token_ids"]["<cain>"] == 273
          assert result["control_token_ids"]["<oro>"] == 274
          PY
      - name: Emit conservative readiness baseline
        run: |
          set +e
          python scripts/readiness_score.py evidence/readiness-input.json --threshold 0.85 --output evidence/readiness.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          result = json.load(open("evidence/readiness.json", encoding="utf-8"))
          assert result["ready"] is False
          assert result["unresolved_blockers"]
          assert result["claim_boundary"]["readiness_is_benchmark_accuracy"] is False
          PY
