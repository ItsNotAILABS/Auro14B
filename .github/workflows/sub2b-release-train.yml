name: AURO Sub-2B Release Train Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check numpy pytest

      - name: Compile release train
        run: |
          python -m py_compile \
            auro_native_llm/release_train.py \
            auro_native_llm/model/train.py \
            scripts/inventory_auro_checkpoints.py \
            scripts/build_sub2b_release_train.py \
            scripts/checkpoint_promotion_gate.py

      - name: Run custody and planning tests
        run: |
          mkdir -p artifacts/sub2b-release
          python -m pytest -q \
            tests/test_checkpoint_inventory_custody.py \
            tests/test_sub2b_release_train.py \
            tests/test_corpus_family_alignment.py \
            tests/test_family_moe_context_policy.py \
            tests/test_model_taxonomy.py \
            | tee artifacts/sub2b-release/pytest.txt

      - name: Build non-executing release plan fixture
        run: |
          mkdir -p artifacts/sub2b-release/empty-checkpoints
          cat > artifacts/sub2b-release/corpus-manifest.json <<'JSON'
          {
            "schema": "auro.corpus.manifest.v1",
            "content_sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          }
          JSON
          cat > artifacts/sub2b-release/tokenizer-manifest.json <<'JSON'
          {
            "schema": "auro.tokenizer.manifest.v2",
            "content_sha256": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          }
          JSON
          python scripts/build_sub2b_release_train.py \
            --checkpoint-root artifacts/sub2b-release/empty-checkpoints \
            --corpus-manifest artifacts/sub2b-release/corpus-manifest.json \
            --tokenizer-manifest artifacts/sub2b-release/tokenizer-manifest.json \
            --output artifacts/sub2b-release/release-train.json

      - name: Verify fail-closed release semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('artifacts/sub2b-release/release-train.json').read_text())
          expected = [
              'Auro-156K',
              'Auro-250M',
              'Auro-500M',
              'Auro-500M-SENSUS',
              'Auro-500M-PRAXIS',
              'Auro-500M-VERBUM',
              'Auro-2B',
          ]
          assert plan['schema'] == 'auro.sub2b.release-train.v1'
          assert plan['release_sequence'] == expected
          assert plan['release_ready'] is False
          assert plan['training_executed'] is False
          assert plan['checkpoints_created'] is False
          assert plan['checkpoints_promoted'] is False
          assert len(plan['plan_sha256']) == 64
          lanes = {item['lane']['model_id']: item for item in plan['lanes']}
          assert lanes['Auro-500M-SENSUS']['training_job']['command'] is None
          assert any('adapter trainer' in blocker for blocker in lanes['Auro-500M-SENSUS']['execution_blockers'])
          assert lanes['Auro-2B']['missing_prerequisites']
          assert all(item['training_job']['approved'] is False for item in plan['lanes'])
          print('sub-2B release train fail-closed contract: PASS')
          PY

      - name: Verify inventory gate rejects an empty release
        run: |
          set +e
          python scripts/inventory_auro_checkpoints.py \
            --root artifacts/sub2b-release/empty-checkpoints \
            --output artifacts/sub2b-release/inventory.json \
            --require-ship-through-2b
          status=$?
          set -e
          test "$status" -eq 6

      - name: Generate source evidence receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = [
              'auro_native_llm/release_train.py',
              'auro_native_llm/model/train.py',
              'scripts/inventory_auro_checkpoints.py',
              'scripts/build_sub2b_release_train.py',
              'scripts/checkpoint_promotion_gate.py',
              'tests/test_checkpoint_inventory_custody.py',
              'tests/test_sub2b_release_train.py',
              'docs/SUB2B_RELEASE_TRAIN_V1.md',
          ]
          files = {
              path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
              for path in paths
          }
          payload = {
              'schema': 'auro.sub2b-release-train.source-evidence.v1',
              'evidence_class': 'E3-validated-output',
              'release_identities': [
                  'Auro-156K', 'Auro-250M', 'Auro-500M',
                  'Auro-500M-SENSUS', 'Auro-500M-PRAXIS',
                  'Auro-500M-VERBUM', 'Auro-2B',
              ],
              'files': files,
              'tests': [
                  'fake signature rejection',
                  'constitutional manifest verification',
                  'checkpoint-pinned training provenance',
                  'checkpoint-pinned evaluation',
                  'through-2B and triad aggregation',
                  'deterministic release planning',
                  'fail-closed empty release gate',
              ],
              'claim_boundary': (
                  'This artifact validates source and deterministic fixture behavior. '
                  'It does not prove that a new model was trained, evaluated, promoted, '
                  'packaged, deployed, or published.'
              ),
          }
          payload['receipt_sha256'] = hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          destination = Path('artifacts/sub2b-release/source-evidence.json')
          destination.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: auro-sub2b-release-train-evidence
          path: artifacts/sub2b-release
          if-no-files-found: error
