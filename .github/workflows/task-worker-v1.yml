name: AURO Council Task Worker Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  council-task-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check numpy pytest
      - name: Compile worker and CLI
        run: |
          python -m py_compile \
            auro_native_llm/production_fleet/task_runtime.py \
            auro_native_llm/production_fleet/task_worker.py \
            scripts/run_council_task_worker.py
      - name: Run worker tests
        run: |
          mkdir -p artifacts/task-worker
          python -m pytest -q \
            tests/test_task_runtime_v1.py \
            tests/test_task_worker_v1.py \
            | tee artifacts/task-worker/pytest.txt
      - name: Generate worker source receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          paths = [
              'auro_native_llm/production_fleet/task_runtime.py',
              'auro_native_llm/production_fleet/task_worker.py',
              'scripts/run_council_task_worker.py',
              'tests/test_task_runtime_v1.py',
              'tests/test_task_worker_v1.py',
              'docs/AURO_TASK_RUNTIME_V1.md',
          ]
          payload = {
              'schema': 'auro.council-task-worker.source-evidence.v1',
              'evidence_class': 'E3-validated-output',
              'files': {
                  path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
                  for path in paths
              },
              'capabilities': [
                  'analysis',
                  'research',
                  'writing',
                  'independent review',
                  'final synthesis',
                  'artifact generation',
                  'dependency-context consumption',
              ],
              'excluded_capabilities': [
                  'shell execution',
                  'code execution',
                  'build execution',
                  'test execution',
                  'deployment',
              ],
              'claim_boundary': (
                  'The fixture validates worker orchestration and artifact contracts. '
                  'It does not prove model quality or external execution.'
              ),
          }
          payload['receipt_sha256'] = hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          target = Path('artifacts/task-worker/source-evidence.json')
          target.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: auro-council-task-worker-evidence
          path: artifacts/task-worker
          if-no-files-found: error
