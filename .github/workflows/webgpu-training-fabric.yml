name: WebGPU Training Fabric Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webgpu-training-fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check numpy pytest

      - name: Compile Python and JavaScript sources
        run: |
          python -m py_compile \
            auro_native_llm/webgpu_cluster/__init__.py \
            auro_native_llm/webgpu_cluster/coordinator.py \
            auro_native_llm/polyglot/webgpu_cluster.py \
            auro_native_llm/polyglot/cuda_plane.py
          node --check browser-brain/training/node.js

      - name: Run persistent cluster and training integration tests
        run: |
          mkdir -p artifacts/webgpu-training-fabric
          python -m pytest -q tests/test_webgpu_training_fabric_v1.py \
            | tee artifacts/webgpu-training-fabric/pytest.txt

      - name: Verify browser-node and coordinator security markers
        run: |
          python - <<'PY'
          from pathlib import Path
          coordinator = Path('auro_native_llm/webgpu_cluster/coordinator.py').read_text(encoding='utf-8')
          node = Path('browser-brain/training/node.js').read_text(encoding='utf-8')
          required_coordinator = [
              'PRAGMA journal_mode=WAL',
              'lease_token',
              'invalid or replayed lease token',
              'non-loopback coordinator binding requires a 32+ character token',
              'worker-reported browser WebGPU execution',
          ]
          required_node = [
              'navigator.gpu.requestAdapter',
              'request("/lease/renew"',
              'lease_token: job.lease_token',
              'fragment.get("token")',
              'history.replaceState',
          ]
          missing = [item for item in required_coordinator if item not in coordinator]
          missing += [item for item in required_node if item not in node]
          if 'query.get("token")' in node:
              missing.append('token must not be read from query string')
          if missing:
              raise SystemExit(f'WebGPU security contract failed: {missing}')
          print('WebGPU security contract: PASS')
          PY

      - name: Generate source evidence receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = [
              'auro_native_llm/webgpu_cluster/coordinator.py',
              'auro_native_llm/webgpu_cluster/__init__.py',
              'auro_native_llm/polyglot/webgpu_cluster.py',
              'auro_native_llm/polyglot/cuda_plane.py',
              'browser-brain/training/node.html',
              'browser-brain/training/node.js',
              'tests/test_webgpu_training_fabric_v1.py',
              'docs/WEBGPU_TRAINING_FABRIC_V1.md',
          ]
          payload = {
              'schema': 'auro.webgpu-training-fabric.source-evidence.v1',
              'evidence_class': 'E3-validated-output',
              'files': {
                  path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
                  for path in paths
              },
              'validated': [
                  'SQLite/WAL queue persistence',
                  'one-time worker-bound leases',
                  'lease expiry and bounded reissue',
                  'result shape and finite-value validation',
                  'optional signed receipts',
                  'HTTP client transport',
                  'training-plane backend selection',
                  'linear training-step matrix integration',
                  'browser WGSL and lease renewal source contract',
              ],
              'claim_boundary': (
                  'This artifact validates source and deterministic integration tests. '
                  'It does not prove execution on a physical browser GPU, full-corpus model '
                  'training, checkpoint production, speedup, quality, or external custody.'
              ),
          }
          payload['receipt_sha256'] = hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          destination = Path('artifacts/webgpu-training-fabric/source-evidence.json')
          destination.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: webgpu-training-fabric-evidence
          path: artifacts/webgpu-training-fabric
          if-no-files-found: error
