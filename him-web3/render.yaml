services:
  - type: web
    name: thesis-monad-hq
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build:client
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONAD_RPC_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"

